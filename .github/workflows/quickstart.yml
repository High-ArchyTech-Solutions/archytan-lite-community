# Runs the quickstart exactly as the README tells people to, against the
# published image, whenever the README or the scripts change and once a
# week. The weekly run catches what a change here never would: a registry or
# image problem that breaks the first thing a new developer tries. Each run
# pulls the image once, so it runs only when something it tests changed:
# the adoption numbers count image pulls.
name: Quickstart

on:
  push:
    branches: [main]
    paths: ["README.md", "quickstart/**", ".github/workflows/quickstart.yml"]
  pull_request:
    paths: ["README.md", "quickstart/**", ".github/workflows/quickstart.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README and both scripts pin the same image
        run: |
          pins=$(grep -ho 'archytan-lite:[0-9][0-9.]*' README.md quickstart/quickstart.sh quickstart/quickstart.ps1 | sort -u)
          echo "$pins"
          test "$(echo "$pins" | wc -l)" -eq 1

      - name: bash
        run: bash quickstart/quickstart.sh

      - name: Clean up
        run: docker rm -f archytan-quickstart && docker volume rm archytan-quickstart

      - name: PowerShell 7
        run: pwsh -NoProfile -File quickstart/quickstart.ps1
